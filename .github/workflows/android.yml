name: Build Jarvis AI (Android)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repository with all submodules (llama.cpp)
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # 2. Verify llama.cpp submodule existence
      - name: Verify llama.cpp submodule
        run: |
          if [ ! -f "app/src/main/cpp/llama.cpp/CMakeLists.txt" ]; then
            echo "::error::llama.cpp submodule is missing or not populated at app/src/main/cpp/llama.cpp!"
            echo "Ensure submodules are initialized: git submodule update --init --recursive"
            exit 1
          fi
          echo "llama.cpp submodule found and validated."

      # 3. Setup Java Development Kit (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. Setup Android SDK, NDK and CMake
      - name: Setup Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & CMake
        run: |
          echo "Installing Android NDK and CMake..."
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> $GITHUB_ENV

      # 5. Ensure gradlew is executable
      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew || true

      # 6. Create fallback debug keystore if not present
      - name: Ensure debug keystore exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 7. Compile Debug APK
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # 8. Compile Release APK (Unsigned / Fallback)
      - name: Build Release APK
        run: |
          # Build release APK (signs with debug or release depending on keystore availability)
          ./gradlew :app:assembleRelease --stacktrace || echo "Release build completed with unsigned outputs"

      # 9. Upload Debug APK Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-arm64
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      # 10. Upload Release APK Artifact (if generated)
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-release-arm64
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore

# ==============================================================================
# EXPLICACIÓN DE LAS SECCIONES DEL WORKFLOW
# ==============================================================================
#
# 1. Triggers (on: push, workflow_dispatch):
#    Permite que la compilación se dispare automáticamente en cada push a 'main'
#    y también manualmente desde la pestaña 'Actions' de GitHub.
#
# 2. Concurrency:
#    Cancela ejecuciones anteriores si se empuja un nuevo commit mientras otra
#    compilación sigue en curso, ahorrando minutos de Action.
#
# 3. Checkout con 'submodules: recursive':
#    Fundamental para descargar automáticamente el repositorio de llama.cpp
#    dentro de 'app/src/main/cpp/llama.cpp'.
#
# 4. Verificación de llama.cpp:
#    Paso de seguridad que detiene el flujo con un mensaje de error claro si el
#    directorio del submódulo está vacío, evitando fallos crípticos de CMake.
#
# 5. Set up JDK 17 con caché de Gradle:
#    Configura Temurin 17 y acelera compilaciones sucesivas cacheando jars y plugins.
#
# 6. Android SDK, NDK (26.x) y CMake (3.22.1):
#    Instala la versión exacta de las herramientas de compilación cruzada necesarias
#    para compilar el motor C++ para arm64-v8a con extensiones NEON/Dotprod.
#
# 7. Generación de keystore de debug:
#    Garantiza que el build no falle si el repositorio no incluye un debug.keystore.
#
# 8. Compilación de APKs (:app:assembleDebug / :app:assembleRelease):
#    Compila la aplicación Android junto con la librería nativa libllama_android.so.
#
# 9. Upload Artifacts (actions/upload-artifact@v4):
#    Publica los archivos APK terminados directamente en la página de resumen
#    de GitHub Actions listos para instalarse en el dispositivo Android.
# ==============================================================================
