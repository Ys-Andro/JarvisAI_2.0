name: Build Jarvis AI (Android)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure llama.cpp submodule is present
        run: |
          if [ -f "app/src/main/cpp/llama.cpp/CMakeLists.txt" ]; then
            echo "llama.cpp already present"
          else
            git submodule update --init --recursive || true
            if [ ! -f "app/src/main/cpp/llama.cpp/CMakeLists.txt" ]; then
              rm -rf app/src/main/cpp/llama.cpp
              git clone --depth 1 https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Configure Android SDK, NDK and CMake
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK integrity
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK: $APK"
          ls -lh "$APK"
          unzip -t "$APK"
          python3 -c "import zipfile,os,sys; apk=r'''$APK'''; print('size',os.path.getsize(apk)); z=zipfile.ZipFile(apk); e=z.testzip();
print('CORRUPT',e) or sys.exit(1) if e else print('entries',len(z.namelist()),'APK OK')"

      - name: Pack Debug APK into tar
        run: |
          set -e
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" dist/app-debug.apk
          tar -cf dist/jarvis-debug.tar -C dist app-debug.apk
          ls -lh dist/
          tar -tf dist/jarvis-debug.tar

      - name: Upload Debug APK (as tar)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-arm64
          path: dist/jarvis-debug.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Build Release APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon || echo "Release skipped"

      - name: Pack Release APK into tar
        run: |
          if ls app/build/outputs/apk/release/*.apk 1>/dev/null 2>&1; then
            mkdir -p dist-release
            APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
            cp "$APK" dist-release/app-release.apk
            tar -cf dist-release/jarvis-release.tar -C dist-release app-release.apk
          else
            echo "No release APK"
          fi

      - name: Upload Release APK (as tar)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-release-arm64
          path: dist-release/jarvis-release.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: ignore
