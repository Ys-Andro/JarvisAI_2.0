name: Build Jarvis AI (Android)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Checkout or Clone llama.cpp automatically
      - name: Ensure llama.cpp submodule is present
        run: |
          echo "Checking for llama.cpp source..."
          if [ -f "app/src/main/cpp/llama.cpp/CMakeLists.txt" ]; then
            echo "llama.cpp already present via workspace/cache."
          else
            echo "llama.cpp not found. Initializing via git submodule..."
            git submodule update --init --recursive || true
            
            # Fallback in case repository does not have the submodule pointer yet:
            if [ ! -f "app/src/main/cpp/llama.cpp/CMakeLists.txt" ]; then
              echo "Cloning llama.cpp shallow repository as fallback..."
              rm -rf app/src/main/cpp/llama.cpp
              git clone --depth 1 https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp
            fi
          fi
          
          if [ -f "app/src/main/cpp/llama.cpp/CMakeLists.txt" ]; then
            echo "Successfully verified llama.cpp at app/src/main/cpp/llama.cpp"
          else
            echo "::warning::llama.cpp could not be retrieved. CMake will compile with JNI interface fallback."
          fi

      # 3. Setup Java Development Kit (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Install NDK & CMake
      - name: Install Android NDK & CMake
        run: |
          echo "y" | ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/26.1.10909125" >> $GITHUB_ENV

      # 6. Ensure gradlew is executable
      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew || true

      # 7. Create fallback debug keystore if not present
      - name: Ensure debug keystore exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 8. Compile Debug APK
      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      # 9. Compile Release APK (Optional)
      - name: Build Release APK
        run: |
          ./gradlew :app:assembleRelease --stacktrace || echo "Release build completed or skipped."

      # 10. Upload Debug APK Artifact
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-arm64
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      # 11. Upload Release APK Artifact (if generated)
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-release-arm64
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: ignore
