name: Build Jarvis AI (Android)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Checkout or Clone llama.cpp automatically
      - name: Ensure llama.cpp submodule is present
        run: |
          echo "Checking for llama.cpp source..."
          if [ -f "app/src/main/cpp/llama.cpp/CMakeLists.txt" ]; then
            echo "llama.cpp already present via workspace/cache."
          else
            echo "llama.cpp not found. Initializing via git submodule..."
            git submodule update --init --recursive || true
            
            # Fallback in case repository does not have the submodule pointer yet:
            if [ ! -f "app/src/main/cpp/llama.cpp/CMakeLists.txt" ]; then
              echo "Cloning llama.cpp shallow repository as fallback..."
              rm -rf app/src/main/cpp/llama.cpp
              git clone --depth 1 https://github.com/ggerganov/llama.cpp.git app/src/main/cpp/llama.cpp
            fi
          fi
          
          if [ -f "app/src/main/cpp/llama.cpp/CMakeLists.txt" ]; then
            echo "Successfully verified llama.cpp at app/src/main/cpp/llama.cpp"
          else
            echo "::warning::llama.cpp could not be retrieved. CMake will compile with JNI interface fallback."
          fi

      # 3. Setup Java Development Kit (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Setup Gradle Build Tool directly
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 5. Verify and configure pre-installed Android SDK, NDK and CMake
      - name: Configure Android SDK, NDK and CMake
        run: |
          echo "Configuring Android environment on ubuntu-latest runner..."
          
          if [ -z "$ANDROID_HOME" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          
          # Accept licenses automatically
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install or verify NDK and CMake
          echo "Installing/verifying NDK and CMake..."
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"
          
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "NDK and CMake configured successfully."

      # 6. Create fallback debug keystore if not present
      - name: Ensure debug keystore exists
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "Generating temporary debug.keystore..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 7. Compile Debug APK
      - name: Build Debug APK
        run: |
          echo "Building Debug APK using installed Gradle..."
          gradle :app:assembleDebug --stacktrace --info --no-daemon

      - name: Verify Debug APK integrity
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          echo "APK: $APK"
          ls -lh "$APK"
          unzip -t "$APK"
          python3 -c "
import zipfile, os, sys
apk = '''$APK'''
print('size:', os.path.getsize(apk))
with zipfile.ZipFile(apk) as z:
    err = z.testzip()
    if err:
        print('CORRUPT:', err)
        sys.exit(1)
    print('entries:', len(z.namelist()))
    print('APK integrity OK')
"

      - name: Pack Debug APK into tar
        run: |
          set -e
          mkdir -p dist
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          cp "$APK" dist/app-debug.apk
          # tar sin compresión (solo contenedor)
          tar -cf dist/jarvis-debug.tar -C dist app-debug.apk
          ls -lh dist/
          # verificar que el tar se puede listar
          tar -tf dist/jarvis-debug.tar

      - name: Upload Debug APK (as tar)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-debug-arm64
          path: dist/jarvis-debug.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Build Release APK
        run: |
          echo "Building Release APK using installed Gradle..."
          gradle :app:assembleRelease --stacktrace --no-daemon || echo "Release build completed or skipped."

      - name: Pack Release APK into tar (if exists)
        if: success()
        run: |
          set -e
          if ls app/build/outputs/apk/release/*.apk 1> /dev/null 2>&1; then
            mkdir -p dist-release
            APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
            cp "$APK" dist-release/app-release.apk
            tar -cf dist-release/jarvis-release.tar -C dist-release app-release.apk
            ls -lh dist-release/
          else
            echo "No release APK found, skipping pack."
          fi

      - name: Upload Release APK (as tar)
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-release-arm64
          path: dist-release/jarvis-release.tar
          compression-level: 0
          retention-days: 14
          if-no-files-found: ignore
